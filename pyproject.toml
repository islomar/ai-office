[project]
name = "ai-office"
version = "0.1.0"
description = "Tools that create and check the records of the ai-office workspace"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ai-office = "ai_office.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/ai_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
